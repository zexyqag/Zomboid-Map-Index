name: Requests

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

# The latest edit of an issue is the one that counts.
concurrency:
  group: request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the request
        run: bash ci/request.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
