name: Discover

on:
  schedule:
    - cron: '13 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: How many issues to open (empty tops the queue up, as the daily run does)
        required: false
      top:
        description: How many of the most subscribed maps to look through (empty takes the DISCOVER_TOP variable, 500 unless set)
        required: false
      tags:
        description: Workshop tags the maps must also have, comma-separated, such as Build 42 (empty takes the DISCOVER_TAGS variable)
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Queue popular maps
        run: bash ci/discover.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DISCOVER_TOP: ${{ inputs.top || vars.DISCOVER_TOP || 500 }}
          DISCOVER_QUEUE: ${{ vars.DISCOVER_QUEUE || 50 }}
          DISCOVER_COUNT: ${{ inputs.count }}
          DISCOVER_TAGS: ${{ inputs.tags || vars.DISCOVER_TAGS }}
