name: Pages

on:
  push:
    branches: [main]
    paths: ['items/**', 'vanilla/**', 'site/**', 'ci/site.sh', 'ci/mod_info.sh', 'ci/workshop.sh', 'ci/lib.sh', '.github/workflows/pages.yml']
  # The Workshop's figures change every day.
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Read the Workshop's figures
        run: bash ci/workshop.sh > "${RUNNER_TEMP}/workshop.json"
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Build the site
        run: bash ci/site.sh _site "${RUNNER_TEMP}/workshop.json"

      # A re-run keeps the artifacts of earlier attempts, and deploy-pages refuses two with one name.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
