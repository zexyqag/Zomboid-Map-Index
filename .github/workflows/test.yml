name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck -x -S warning ci/*.sh test/*.sh worker/*.sh

      - name: Run tests
        run: bash test/run.sh

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the worker image
        run: docker build --file worker/Dockerfile --tag zomboid-map-index-worker .
