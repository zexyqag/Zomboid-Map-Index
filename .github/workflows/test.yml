name: Test

on:
  push:
    # The worker's data commits change nothing the tests run.
    paths-ignore: ['items/**', 'vanilla/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck -x -S warning ci/*.sh test/*.sh worker/*.sh

      - name: Run tests
        run: bash test/run.sh
